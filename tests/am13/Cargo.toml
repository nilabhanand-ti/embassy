[package]
edition = "2024"
name = "embassy-am13-tests"
version = "0.1.0"
license = "MIT OR Apache-2.0"
publish = false

[features]
am13e232n9 = [ "embassy-am13/am13e232n9pdt" ]
am13e23019 = [ "embassy-am13/am13e23019gpm" ]

[dependencies]
teleprobe-meta = "1.1"

embassy-executor = { version = "0.10.0", path = "../../embassy-executor", features = [ "platform-cortex-m", "executor-thread", "defmt" ] }
embassy-am13 = { version = "0.1.0", path = "../../embassy-am13", features = [ "rt", "defmt", "unstable-pac", "time-driver-any" ]  }
embassy-time = { version = "0.5.1", path = "../../embassy-time", features = [ "defmt" ] }
embassy-futures = { version = "0.1.2", path = "../../embassy-futures" }

defmt = "1.0.1"
defmt-rtt = "1.0.0"

cortex-m = { version = "0.7.6", features = [ "inline-asm", "critical-section-single-core" ]}
cortex-m-rt = "0.7.0"
embedded-io = { version = "0.7.1", features = ["defmt"] }
embedded-io-async = { version = "0.7.0", features = ["defmt"] }
panic-probe = { version = "1.0.0", features = ["print-defmt"] }

[profile.dev]
debug = 2
debug-assertions = true
opt-level = 's'
overflow-checks = true

[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = "fat"
opt-level = 's'
overflow-checks = false

# do not optimize proc-macro crates = faster builds from scratch
[profile.dev.build-override]
codegen-units = 8
debug = false
debug-assertions = false
opt-level = 0
overflow-checks = false

[profile.release.build-override]
codegen-units = 8
debug = false
debug-assertions = false
opt-level = 0
overflow-checks = false

[package.metadata.embassy]
build = [
  { target = "thumbv8m.main-none-eabihf", features = ["am13e232n9"], artifact-dir = "out/tests/am13e232n9" },
  { target = "thumbv8m.main-none-eabihf", features = ["am13e23019"], artifact-dir = "out/tests/am13e23019" }
]
