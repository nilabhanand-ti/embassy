[package]
edition = "2024"
name = "embassy-am13e232n9-examples"
version = "0.1.0"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
embassy-mspm0 = { version = "0.1.0", path = "../../embassy-mspm0", features = ["am13e232n9pdt", "rt", "time-driver-any", "unstable-pac"] }
embassy-executor = { version = "0.10.0", path = "../../embassy-executor", features = ["platform-cortex-m", "executor-thread"] }
embassy-time = { version = "0.5.1", path = "../../embassy-time" }
embassy-futures = { version = "0.1.2", path = "../../embassy-futures" }
cortex-m = { version = "0.7.6", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = { version = "0.7.0"}
embedded-io-async = { version = "0.7.0" }
heapless = { version = "0.9", default-features = false }
panic-halt = "1.0.0"

[profile.release]
debug = 2

[package.metadata.embassy]
build = [
  { target = "thumbv8m.main-none-eabihf", artifact-dir = "out/examples/am13e232n9" }
]
