[package]
name = "embassy-am13"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Embassy Hardware Abstraction Layer (HAL) for Texas Instruments AM13E2x microcontrollers"
keywords = ["embedded", "async", "am13", "ti", "hal"]
categories = ["embedded", "hardware-support", "no-std", "asynchronous"]
repository = "https://github.com/embassy-rs/embassy"
documentation = "https://docs.embassy.dev/embassy-am13"
publish = false

[package.metadata.embassy]
build = [
    {target = "thumbv8m.main-none-eabihf", features = ["defmt", "am13e23019gpm", "time-driver-any"]},
    {target = "thumbv8m.main-none-eabihf", features = ["defmt", "am13e23018pt", "time-driver-any"]},
    {target = "thumbv8m.main-none-eabihf", features = ["defmt", "am13e23017pdt", "time-driver-any"]},
    {target = "thumbv8m.main-none-eabihf", features = ["defmt", "am13e232n9pdt", "time-driver-any"]},
    {target = "thumbv8m.main-none-eabihf", features = ["defmt", "am13e23219bga144"]},
    {target = "thumbv8m.main-none-eabihf", features = ["log", "am13e23218lqfp64g", "time-driver-timg4"]},
]

[package.metadata.embassy_docs]
src_base = "https://github.com/embassy-rs/embassy/blob/embassy-am13-v$VERSION/embassy-am13/src/"
src_base_git = "https://github.com/embassy-rs/embassy/blob/$COMMIT/embassy-am13/src/"

features = ["defmt", "unstable-pac", "time-driver-any"]
flavors = [
    { regex_feature = "am13.*", target = "thumbv8m.main-none-eabihf" },
]

[package.metadata.docs.rs]
features = ["defmt", "unstable-pac", "time-driver-any", "am13e232n9pdt"]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
embassy-sync = { version = "0.8.0", path = "../embassy-sync" }
# TODO: Support other tick rates
embassy-time-driver = { version = "0.2.2", path = "../embassy-time-driver", optional = true, features = ["tick-hz-32_768"] }
embassy-time-queue-utils = { version = "0.3.2", path = "../embassy-time-queue-utils", optional = true }
# The AM13E230x has 4 NVIC priority bits and the AM13E232x SDK gives 2. Two bits work on both.
embassy-hal-internal = { version = "0.5.0", path = "../embassy-hal-internal", features = ["cortex-m", "prio-bits-2"] }
embassy-embedded-hal = { version = "0.6.0", path = "../embassy-embedded-hal", default-features = false }

embedded-hal-02 = { package = "embedded-hal", version = "0.2.6", features = ["unproven"] }
embedded-hal = { version = "1.0" }
embedded-hal-nb = { version = "1.0" }
embedded-hal-async = { version = "1.0" }
embedded-io = { version = "0.7.1" }
embedded-io-async = { version = "0.7.0" }

defmt = { version = "1.0.1", optional = true }
log = { version = "0.4.14", optional = true }
cortex-m-rt = ">=0.6.15,<0.8"
cortex-m = "0.7.6"
critical-section = "1.2.0"

# The AM13E2x are generated by mspm0-data, with the MSPM0: they share most of their peripherals.
# Downstream of mspm0-rs/mspm0-data-generated, with the AM13E2x added.
mspm0-metapac = { git = "https://github.com/nilabhanand-ti/mspm0-data-generated/", tag = "mspm0-data-651e22c6e6a81189c4b893d484d5337f555f4113" }
# Force no cache padding or the types are too large.
maitake-sync = { version = "0.3.0", default-features = false, features = ["critical-section", "no-cache-pad"]}
portable-atomic = { version = "1.13.1", features = ["critical-section"] }

[build-dependencies]
proc-macro2 = "1.0.94"
quote = "1.0.40"
mspm0-metapac = { git = "https://github.com/nilabhanand-ti/mspm0-data-generated/", tag = "mspm0-data-651e22c6e6a81189c4b893d484d5337f555f4113", default-features = false, features = ["metadata"] }

[features]
default = ["rt"]

## Enable `mspm0-metapac`'s `rt` feature
rt = ["mspm0-metapac/rt"]

## Use [`defmt`](https://docs.rs/defmt/latest/defmt/) for logging
defmt = [
    "dep:defmt",
    "embassy-sync/defmt",
    "embassy-embedded-hal/defmt",
    "embassy-hal-internal/defmt",
]

## Use log for logging
log = ["dep:log"]

## Re-export mspm0-metapac at `embassy_am13::pac`.
## This is unstable because semver-minor (non-breaking) releases of embassy-am13 may major-bump (breaking) the mspm0-metapac version.
## If this is an issue for you, you're encouraged to directly depend on a fixed version of the PAC.
## There are no plans to make this stable.
unstable-pac = []

## Allow using the SWD pins (PA13 and PA14) as regular GPIO pins.
swd-pins-as-gpio = []

#! ## Time

# Features starting with `_` are for internal use only. They're not intended
# to be enabled by other crates, and are not covered by semver guarantees.
_time-driver = ["dep:embassy-time-driver", "dep:embassy-time-queue-utils"]

## Use any time driver
time-driver-any = ["_time-driver"]
## Use TIMG4 as time driver
time-driver-timg4 = ["_time-driver"]

#! ## Chip-selection features
#! Select your chip by specifying the model as a feature, e.g. `am13e232n9pdt`.
#! Check the `Cargo.toml` for the latest list of supported chips.
#!
#! **Important:** Do not forget to adapt the target architecture to your chip:
#! the AM13E2x are Cortex-M33 with an FPU, `thumbv8m.main-none-eabihf`.

am13e23017gpm = ["mspm0-metapac/am13e23017gpm"]
am13e23017gpz = ["mspm0-metapac/am13e23017gpz"]
am13e23017hpm = ["mspm0-metapac/am13e23017hpm"]
am13e23017hpz = ["mspm0-metapac/am13e23017hpz"]
am13e23017pdt = ["mspm0-metapac/am13e23017pdt"]
am13e23017pn = ["mspm0-metapac/am13e23017pn"]
am13e23017pt = ["mspm0-metapac/am13e23017pt"]
am13e23017rgz = ["mspm0-metapac/am13e23017rgz"]
am13e23018gpm = ["mspm0-metapac/am13e23018gpm"]
am13e23018gpz = ["mspm0-metapac/am13e23018gpz"]
